[project]
name = "biology_lesson_flow"
version = "0.1.0"
description = "biology-lesson-flow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.15.21,<2.0.0",
]

[project.scripts]
kickoff = "biology_lesson_flow.main:kickoff"
run_crew = "biology_lesson_flow.main:kickoff"
plot = "biology_lesson_flow.main:plot"
run_with_trigger = "biology_lesson_flow.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "d4050e77-3218-43f2-9ce0-faf5bd3e532a"
